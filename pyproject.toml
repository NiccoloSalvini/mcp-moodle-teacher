[project]
name = "mcp-moodle-teacher"
version = "0.1.0"
description = "Teacher-side MCP server for Moodle: submissions, grading, enrolments, announcements"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Niccolo Salvini" }]
keywords = ["mcp", "moodle", "teaching", "grading", "lms"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
]
dependencies = ["mcp>=2.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/NiccoloSalvini/mcp-moodle-teacher"
Issues = "https://github.com/NiccoloSalvini/mcp-moodle-teacher/issues"

[project.scripts]
mcp-moodle-teacher = "mcp_moodle_teacher.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
