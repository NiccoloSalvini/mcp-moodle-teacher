<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="470" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#363636">Step 2 — install the extension in Claude Desktop</text>
  <text x="30" y="60" font-size="14" fill="#7a7f85">Settings ▸ Extensions ▸ Install Extension… then pick the file you downloaded.</text>

  <!-- window -->
  <rect x="30" y="80" width="840" height="330" rx="8" fill="#ffffff" stroke="#c9c4b8"/>
  <rect x="30" y="80" width="840" height="36" rx="8" fill="#f2efe8"/>
  <rect x="30" y="108" width="840" height="8" fill="#f2efe8"/>
  <circle cx="50" cy="98" r="5" fill="#d9d4c8"/><circle cx="68" cy="98" r="5" fill="#d9d4c8"/><circle cx="86" cy="98" r="5" fill="#d9d4c8"/>
  <text x="450" y="103" font-size="12" font-weight="600" fill="#7a7f85" text-anchor="middle">Settings</text>

  <!-- sidebar -->
  <rect x="30" y="116" width="188" height="294" fill="#faf9f6"/>
  <line x1="218" y1="116" x2="218" y2="410" stroke="#e6e2d8"/>
  <text x="50" y="146" font-size="13" fill="#7a7f85">General</text>
  <text x="50" y="176" font-size="13" fill="#7a7f85">Profile</text>
  <rect x="38" y="190" width="172" height="30" rx="4" fill="#f3e3e4"/>
  <text x="50" y="210" font-size="13" font-weight="700" fill="#AF1F25">Extensions</text>
  <text x="50" y="240" font-size="13" fill="#7a7f85">Connectors</text>
  <text x="50" y="270" font-size="13" fill="#7a7f85">Account</text>

  <!-- main pane -->
  <text x="246" y="150" font-size="16" font-weight="700" fill="#363636">Extensions</text>
  <rect x="700" y="132" width="146" height="28" rx="4" fill="#AF1F25"/>
  <text x="773" y="151" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Install Extension…</text>

  <!-- installed card -->
  <rect x="246" y="176" width="600" height="212" rx="5" fill="#ffffff" stroke="#e6e2d8"/>
  <rect x="266" y="194" width="34" height="34" rx="5" fill="#AF1F25"/>
  <path d="M271 212 l12 -7 l12 7 l-12 7 z" fill="#ffffff"/>
  <text x="312" y="208" font-size="14" font-weight="700" fill="#363636">Moodle (teacher)</text>
  <text x="312" y="226" font-size="11" fill="#7a7f85">13 tools · enrolments, submissions, marking, announcements</text>
  <rect x="772" y="196" width="56" height="24" rx="12" fill="#e8f3ea"/>
  <text x="800" y="212" font-size="11" font-weight="600" fill="#1E8449" text-anchor="middle">On</text>

  <line x1="266" y1="244" x2="826" y2="244" stroke="#f0ede6"/>

  <text x="266" y="270" font-size="11" font-weight="700" letter-spacing="1" fill="#a8955a">MOODLE WEB SERVICE ADDRESS</text>
  <rect x="266" y="278" width="560" height="30" rx="3" fill="#ffffff" stroke="#c9c4b8"/>
  <text x="278" y="298" font-size="12" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#363636">https://yourmoodle.edu/webservice/rest/server.php</text>

  <text x="266" y="334" font-size="11" font-weight="700" letter-spacing="1" fill="#a8955a">MOODLE TOKEN</text>
  <rect x="266" y="342" width="560" height="30" rx="3" fill="#ffffff" stroke="#c9c4b8"/>
  <text x="278" y="362" font-size="14" fill="#7a7f85">••••••••••••••••••••••••••••••••</text>
  <path d="M846 300 L880 300" stroke="#AF1F25" stroke-width="0" />

  <text x="30" y="440" font-size="12" fill="#7a7f85">Two boxes, filled once. The app keeps the token for you — you never edit a configuration file.</text>
</svg>
