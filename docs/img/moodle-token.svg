<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#363636">Step 1 — the token, on your Moodle</text>
  <text x="30" y="60" font-size="14" fill="#7a7f85">A token is a long password that lets a program act as you. Copy it once.</text>

  <!-- browser chrome -->
  <rect x="30" y="80" width="840" height="286" rx="6" fill="#ffffff" stroke="#c9c4b8"/>
  <rect x="30" y="80" width="840" height="34" rx="6" fill="#f2efe8"/>
  <rect x="30" y="106" width="840" height="8" fill="#f2efe8"/>
  <circle cx="50" cy="97" r="5" fill="#d9d4c8"/><circle cx="68" cy="97" r="5" fill="#d9d4c8"/><circle cx="86" cy="97" r="5" fill="#d9d4c8"/>
  <rect x="110" y="88" width="480" height="18" rx="9" fill="#ffffff" stroke="#ddd8cc"/>
  <text x="122" y="101" font-size="11" fill="#7a7f85">yourmoodle.edu/user/managetoken.php</text>

  <!-- breadcrumb -->
  <rect x="54" y="136" width="300" height="26" rx="3" fill="#f6f4ef"/>
  <text x="66" y="154" font-size="12" fill="#AF1F25">Preferences</text>
  <text x="146" y="154" font-size="12" fill="#7a7f85">/</text>
  <text x="158" y="154" font-size="12" font-weight="600" fill="#363636">Security keys</text>

  <text x="54" y="196" font-size="17" font-weight="700" fill="#363636">Security keys</text>

  <!-- table -->
  <line x1="54" y1="214" x2="846" y2="214" stroke="#AF1F25" stroke-width="2"/>
  <text x="60" y="232" font-size="10" font-weight="700" letter-spacing="1" fill="#7a7f85">KEY</text>
  <text x="330" y="232" font-size="10" font-weight="700" letter-spacing="1" fill="#7a7f85">SERVICE</text>
  <text x="640" y="232" font-size="10" font-weight="700" letter-spacing="1" fill="#7a7f85">VALID UNTIL</text>
  <line x1="54" y1="242" x2="846" y2="242" stroke="#e6e2d8"/>

  <rect x="54" y="246" width="792" height="44" fill="#fdf6f6"/>
  <text x="60" y="274" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace" fill="#363636">4f9c2e••••••••••••••••••••••••8a1b</text>
  <text x="330" y="274" font-size="13" font-weight="600" fill="#363636">Moodle mobile web service</text>
  <text x="640" y="274" font-size="13" fill="#7a7f85">—</text>
  <line x1="54" y1="290" x2="846" y2="290" stroke="#e6e2d8"/>

  <rect x="338" y="250" width="222" height="36" rx="3" fill="none" stroke="#AF1F25" stroke-width="2"/>
  <path d="M566 268 L608 268" stroke="#AF1F25" stroke-width="2" marker-end="url(#t)"/>
  <text x="620" y="264" font-size="13" font-weight="600" fill="#AF1F25">this row</text>
  <text x="620" y="282" font-size="12" fill="#AF1F25">copy its key</text>
  <defs><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#AF1F25"/></marker></defs>

  <text x="54" y="326" font-size="12" fill="#7a7f85">If this page is empty, your role is not allowed to create tokens: ask whoever administers your Moodle for one.</text>

  <text x="30" y="398" font-size="12" fill="#7a7f85">Treat it like a password. Anyone holding it can read and mark work as you.</text>
</svg>
